name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装最新 Vulkan SDK（新版 glslc）
        run: |
          curl -sL -o /tmp/vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
          mkdir -p $HOME/vulkan-sdk && tar -xJf /tmp/vulkan-sdk.tar.xz -C $HOME/vulkan-sdk
          GLSLC_BIN=$(find $HOME/vulkan-sdk -name glslc -type f | head -1)
          echo "found: $GLSLC_BIN"
          echo "$(dirname $GLSLC_BIN)" >> $GITHUB_PATH
          echo "VULKAN_SDK=$(dirname $(dirname $GLSLC_BIN))" >> $GITHUB_ENV
      - name: 确认 glslc 版本
        run: |
          which glslc
          glslc --version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 写入签名配置
        run: |
          cat > android/key.properties <<KEYEOF
          storeFile=$GITHUB_WORKSPACE/privatelm.jks
          storePassword=privatelm
          keyAlias=privatelm
          keyPassword=privatelm
          KEYEOF
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-zh
          path: build/app/outputs/flutter-apk/app-release.apk
